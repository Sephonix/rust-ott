name: SPS DSP Linux plugins
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install native build and validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libx11-xcb-dev libxcb1-dev libxcursor-dev libgl1-mesa-dev liblilv-0-0 lv2-dev sordi xvfb xdotool
      - name: Formatting, lint, and DSP tests
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: Build all three formats
        run: cargo xtask bundle --release --locked
      - name: Verify generated LV2 metadata
        run: |
          cargo xtask metadata
          git diff --exit-code -- plugins/*/metadata
          for plugin in ott room delay echo; do
            lv2_validate target/bundled/sps-$plugin.lv2/*.ttl
            python3 plugins/sps-$plugin/scripts/smoke_lv2.py
          done
      - name: Validate embedded LV2 GUI and host edits
        run: |
          xvfb-run -a python3 plugins/sps-ott/scripts/smoke_lv2.py --ui --exercise-ui --seconds 3
          for plugin in room delay echo; do
            xvfb-run -a python3 plugins/sps-$plugin/scripts/smoke_lv2.py --ui --exercise-ui --exercise-presets --seconds 6
          done
      - name: Validate CLAP
        run: |
          curl --fail --location --output /tmp/clap-validator.zip https://github.com/free-audio/clap-validator/releases/download/0.4.1/clap-validator-0.4.1-127-g152b982-ubuntu-22.04.zip
          echo '49edadcfb407ea0dd946ce418300e853fbd2660fa4b0d00e4f19ff8eef24ad90  /tmp/clap-validator.zip' | sha256sum --check
          mkdir /tmp/clap-validator
          unzip /tmp/clap-validator.zip -d /tmp/clap-validator
          tar -xf /tmp/clap-validator/*.tar.gz -C /tmp/clap-validator
          for plugin in OTT Room Delay Echo; do
            /tmp/clap-validator/clap-validator validate "target/bundled/SPS $plugin.clap"
          done
      - name: Package plugins and license notices
        run: |
          for plugin in ott room delay echo; do
            python3 scripts/package.py sps-$plugin
          done
      - uses: actions/upload-artifact@v4
        with:
          name: sps-suite-linux-x86_64
          path: dist/*-linux-x86_64.tar.gz
          if-no-files-found: error
