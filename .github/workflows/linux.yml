name: Linux plugins
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install native build and validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libx11-xcb-dev libxcb1-dev libxcursor-dev libgl1-mesa-dev liblilv-0-0 lv2-dev sordi xvfb
      - name: Formatting, lint, and DSP tests
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: Build all three formats
        run: cargo xtask bundle --release --locked
      - name: Verify generated LV2 metadata
        run: |
          cargo xtask metadata
          git diff --exit-code -- lv2
          lv2_validate target/bundled/sps-ott.lv2/*.ttl
          python3 scripts/smoke_lv2.py
      - name: Validate embedded LV2 GUI and host edits
        run: xvfb-run -a python3 scripts/smoke_lv2.py --ui --exercise-ui --seconds 3
      - name: Validate CLAP
        run: |
          curl --fail --location --output /tmp/clap-validator.zip https://github.com/free-audio/clap-validator/releases/download/0.4.1/clap-validator-0.4.1-127-g152b982-ubuntu-22.04.zip
          echo '49edadcfb407ea0dd946ce418300e853fbd2660fa4b0d00e4f19ff8eef24ad90  /tmp/clap-validator.zip' | sha256sum --check
          mkdir /tmp/clap-validator
          unzip /tmp/clap-validator.zip -d /tmp/clap-validator
          tar -xf /tmp/clap-validator/*.tar.gz -C /tmp/clap-validator
          /tmp/clap-validator/clap-validator validate 'target/bundled/SPS OTT.clap'
      - name: Package plugins and license notices
        run: python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: sps-ott-linux-x86_64
          path: dist/sps-ott-linux-x86_64.tar.gz
          if-no-files-found: error
